<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <h1>Clip Shot</h1>
    <span class="version">v0.6</span>
  </header>

  <ul class="modes">
    <li>
      <button id="capture-visible" class="mode">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
          <circle cx="12" cy="13" r="4" />
        </svg>
        <span class="label">보이는 영역 캡처</span>
        <span class="hint">즉시 복사</span>
      </button>
    </li>
    <li>
      <button id="capture-partial" class="mode">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 2v14a2 2 0 0 0 2 2h14" />
          <path d="M18 22V8a2 2 0 0 0-2-2H2" />
        </svg>
        <span class="label">부분 캡처</span>
        <span class="hint">드래그 · 스크롤 확장</span>
      </button>
    </li>
    <li>
      <button id="capture-full" class="mode">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="5" y="2" width="14" height="20" rx="2" />
          <path d="M12 18h.01" />
        </svg>
        <span class="label">전체 페이지 캡처</span>
        <span class="hint">자동 이어붙임</span>
      </button>
    </li>
    <li>
      <button id="capture-ocr" class="mode">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 7V4h16v3" />
          <path d="M9 20h6" />
          <path d="M12 4v16" />
        </svg>
        <span class="label">텍스트 추출 (OCR)</span>
        <span class="hint">드래그 · 골라서 복사</span>
      </button>
    </li>
  </ul>

  <p id="status" class="status" role="status"></p>
  <button id="save-png" class="save-btn" hidden>PNG으로 저장</button>

  <footer class="shortcuts">
    <div><kbd data-cmd="capture-partial"></kbd> 부분 캡처</div>
    <div><kbd data-cmd="ocr-partial"></kbd> 텍스트 추출</div>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
